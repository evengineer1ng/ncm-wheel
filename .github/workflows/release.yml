name: Build and release

# Builds the companion on a clean Windows runner and attaches it to the release, so the binary people
# download is demonstrably produced from the public source rather than from someone's desktop. For an
# unsigned tool that drives force-feedback hardware, a reproducible public build is worth more trust than a
# signature from a name nobody recognises.

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # so a build can be exercised without cutting a release

permissions:
  contents: write           # required to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest
    # **A hung job is worse than a failed one.** Three runs sat "in progress" for hours because a dependency
    # installer was waiting for input that was never coming, and a stuck run reports nothing at all.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pysdl2 pysdl2-dll pyinstaller

      - name: Install vgamepad without running its driver installer
        shell: pwsh
        run: |
          # `pip install vgamepad` runs the ViGEmBus setup program during installation. On a desktop that is
          # a UAC prompt; on a headless runner it is a process waiting for input that never comes, which is
          # exactly how three builds hung with no output. A try/catch cannot help -- nothing ever returns.
          #
          # So: fetch the distribution and install it WITHOUT executing its setup code. A wheel cannot run
          # code at install time, which is the whole reason to prefer one. The driver is a requirement on the
          # player's machine, never on the builder's.
          New-Item -ItemType Directory -Force -Path dist-deps | Out-Null
          python -m pip download vgamepad --no-deps --dest dist-deps
          $whl = Get-ChildItem dist-deps -Filter *.whl | Select-Object -First 1
          if ($whl) {
            Write-Host "installing wheel $($whl.Name) with --no-deps (no setup code runs)"
            python -m pip install --no-deps $whl.FullName
          } else {
            # No wheel published: unpack the sdist and drop the package into site-packages by hand, still
            # without running setup.py.
            $sdist = Get-ChildItem dist-deps -Recurse -Include *.tar.gz,*.zip | Select-Object -First 1
            if (-not $sdist) { throw "pip download produced neither a wheel nor an sdist" }
            Write-Host "no wheel published; unpacking $($sdist.Name)"
            tar -xf $sdist.FullName -C dist-deps
            $pkg = Get-ChildItem dist-deps -Directory -Recurse -Filter vgamepad | Select-Object -First 1
            if (-not $pkg) { throw "vgamepad package directory not found in the sdist" }
            $site = python -c "import site; print(site.getsitepackages()[-1])"
            Copy-Item -Recurse -Force $pkg.FullName (Join-Path $site 'vgamepad')
          }
          python -c "import vgamepad, os; print('vgamepad at', os.path.dirname(vgamepad.__file__))"
          if ($LASTEXITCODE -ne 0) { throw "vgamepad is not importable; the virtual controller cannot be built" }

      - name: Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "NCM Wheel Support" `
            --collect-all sdl2dll `
            --collect-all vgamepad `
            --add-data "wheel-profiles;wheel-profiles" `
            --hidden-import sdl2 `
            --hidden-import vgamepad `
            --hidden-import tkinter `
            ncm-wheel.py
          if (-not (Test-Path "dist\NCM Wheel Support.exe")) { throw "build produced no exe" }
          Get-ChildItem dist

      - name: Smoke test the binary
        shell: pwsh
        run: |
          # A runner has no wheel, so this proves the exe starts, unpacks and finds its own bundled data --
          # precisely what 0.1.0 got wrong twice, silently, in ways a source build never showed.
          $log = Join-Path $env:TEMP 'smoke.log'
          $p = Start-Process -FilePath "dist\NCM Wheel Support.exe" -PassThru `
               -ArgumentList '--headless','--no-input','--port','38499','--log',$log
          Start-Sleep -Seconds 25
          if (-not $p.HasExited) { $p.Kill() }
          if (-not (Test-Path $log)) { throw "the packaged build produced no output at all" }
          Get-Content $log
          if ((Get-Content $log -Raw) -match 'no rig profiles loaded') {
            throw "the bundled wheel-profiles were not found inside the exe"
          }

      - name: Checksums
        shell: pwsh
        run: |
          $h = Get-FileHash "dist\NCM Wheel Support.exe" -Algorithm SHA256
          "$($h.Hash.ToLower())  NCM Wheel Support.exe" | Out-File -Encoding ascii "dist\SHA256SUMS.txt"
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ncm-wheel-windows
          path: |
            dist/NCM Wheel Support.exe
            dist/SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true      # a release with no binary is worse than no release
          files: |
            dist/NCM Wheel Support.exe
            dist/SHA256SUMS.txt
          body: |
            Wheel, pedals and force feedback for Cyberpunk 2077 multiplayer on OPEN//77, driven by real
            vehicle telemetry rather than by an FFT over game audio.

            **What changed is in the [changelog](../../#changelog).** The short version: it has a window
            now, hardware can be reassigned by hand when detection gets it wrong, ViGEmBus is offered rather
            than demanded — and two bugs are fixed that existed only in the packaged build, where the device
            profiles and the virtual-controller DLL were never bundled.

            **You do not need Python.** Everything is inside the exe, verified by running it with Python
            removed from the environment.

            **Alpha.** Force levels were measured on a Logitech G29 (gear drive) by walking the full ladder;
            that measurement moved the original reasoned numbers by about 2.5x. The belt and direct-drive
            ceilings are scaled down from that baseline rather than measured on those wheelbases, so they
            deliberately start low. If you have either, the README's safety section says what is useful to
            report.

            Built by GitHub Actions from the tagged source. Verify with `SHA256SUMS.txt`:

            ```powershell
            Get-FileHash ".\NCM Wheel Support.exe" -Algorithm SHA256
            ```

            **Requirements:** Windows 10/11. [ViGEmBus](https://github.com/nefarius/ViGEmBus/releases) for
            wheel and pedal input — the program offers to install it for you — and Logitech G HUB if you
            have a Logitech wheel. Windows SmartScreen will warn on first run because the binary is not code
            signed; choose **More info → Run anyway**, or build it from source.
